<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Discovery — Find your next favourite</title>
    <meta
      name="description"
      content="Discover films worth watching. Explore movie details, cast, trailers and where to watch."
    />
    <meta name="theme-color" content="#0b0b0e" />
    <!-- Warm YouTube connections so the embedded player can start faster after Play is tapped. -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin />
    <link rel="preconnect" href="https://www.google.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link rel="dns-prefetch" href="//www.youtube-nocookie.com" />
    <link rel="dns-prefetch" href="//i.ytimg.com" />
    <meta
      property="og:title"
      content="Movie Discovery — Find your next favourite"
    />
    <meta
      property="og:description"
      content="Discover films worth watching, explore movie details and find your next favourite."
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="boot-screen">Loading your next favourite…</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
